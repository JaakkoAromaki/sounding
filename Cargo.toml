[package]
name = "sounding"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
yt-dlp = "2.8.3"
serde_json = "1"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30.2"
color-eyre = "0.6.5"
serde = { version = "1.0.229", features = ["derive"] }
dirs = "7.0.0"
toml = "1.1.6"
fs2 = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
